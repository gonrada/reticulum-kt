name: Tests

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Run tests with coverage
        run: ./gradlew :rns-core:test :rns-core:koverXmlReport :rns-interfaces:test :rns-interfaces:koverXmlReport --continue

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          files: |
            rns-core/build/reports/kover/report.xml
            rns-interfaces/build/reports/kover/report.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unit-test-reports
          path: |
            rns-core/build/reports/tests/
            rns-interfaces/build/reports/tests/
          retention-days: 14

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install rns==1.5.2

      - name: Clone Reticulum reference implementation
        run: git clone --depth 1 --branch 1.5.2 https://github.com/markqvist/Reticulum.git /tmp/Reticulum

      - name: Clone LXMF reference implementation
        run: git clone --depth 1 --branch 0.9.9 https://github.com/markqvist/LXMF.git /tmp/LXMF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Run rns-test tests with aggregated coverage
        env:
          PYTHON_RNS_PATH: /tmp/Reticulum
          PYTHON_LXMF_PATH: /tmp/LXMF
        # Root-level koverXmlReport aggregates execution data across rns-core,
        # rns-interfaces, and rns-test. `-x :rns-core:test -x :rns-interfaces:test`
        # keeps the coverage job fast by not re-running unit tests already
        # covered in the unit-tests job — codecov merges both uploads.
        run: ./gradlew :rns-test:test koverXmlReport -x :rns-core:test -x :rns-interfaces:test

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          files: build/reports/kover/report.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-test-reports
          path: rns-test/build/reports/tests/
          retention-days: 14
